# Render Blueprint for Sambal & Sakura. See DEPLOY.md for the step-by-step.
# Secrets are NOT stored here: every `sync: false` value is typed into the Render dashboard.
services:
  - type: web
    name: sambalandsakura
    runtime: node
    # LIVE: always on, no sleeping, zero-downtime deploys ($7/mo). `free` sleeps after ~15 min idle
    # (first visit then takes 30-60 s) and has monthly limits - only use it for a test copy.
    plan: starter
    region: frankfurt        # closest Render region to the UK
    autoDeploy: true
    healthCheckPath: /api/health

    # --include=dev: the build needs prisma, typescript and tailwind (dev dependencies).
    # Production uses PostgreSQL, so we derive the Postgres Prisma schema from the dev schema first.
    # Then apply DB migrations and create the owner account ONLY if no admin exists yet (never
    # overwrites, never seeds demo data). Migrations use DIRECT_DATABASE_URL when it is set.
    # (These run in the build because the free plan has no pre-deploy step. At go-live you may move
    # the last two commands to `preDeployCommand:` - see DEPLOY.md "Going live".)
    buildCommand: npm ci --include=dev && node scripts/prepare-postgres.mjs && npx prisma generate --schema prisma/postgres/schema.prisma && DATABASE_URL="${DIRECT_DATABASE_URL:-$DATABASE_URL}" npx prisma migrate deploy --schema prisma/postgres/schema.prisma && node scripts/create-admin.mjs && npm run build

    startCommand: npm run start

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true          # Render creates a strong random secret for you

      # --- Required ---
      # The address the site is served from. Google uses it for the sitemap and canonical links.
      # Keep it equal to your real address: change it to https://yourdomain.co.uk once that domain
      # is connected, and fix it if Render added a suffix to the name below.
      - key: SITE_URL
        value: https://www.sambalandsakura.co.uk
      - key: GOOGLE_SITE_VERIFICATION   # from Google Search Console (HTML tag method) - see DEPLOY.md
        sync: false
      - key: BING_SITE_VERIFICATION     # from Bing Webmaster Tools (HTML meta tag) - Bing feeds ChatGPT search and Copilot
        sync: false
      - key: DATABASE_URL            # Neon POOLED string (host contains -pooler) + &pgbouncer=true&connection_limit=5
        sync: false
      - key: DIRECT_DATABASE_URL     # optional: Neon direct (non-pooled) string, used only for migrations
        sync: false
      - key: ADMIN_EMAIL             # owner login, created on first deploy only
        sync: false
      - key: ADMIN_PASSWORD          # min 12 characters; change it in the app afterwards
        sync: false

      # --- Features (each is optional; the site works without them) ---
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME   # needed for menu photo uploads in production
        sync: false
      - key: CLOUDINARY_API_KEY      # signed uploads (preferred over an unsigned preset)
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # --- Customer emails (Brevo) - see DEPLOY.md "Customer emails" ---
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM              # e.g. orders@sambalandsakura.co.uk (domain verified in Brevo)
        sync: false
      - key: EMAIL_FROM_NAME
        value: Sambal & Sakura
      - key: CAREERS_EMAIL           # optional: where Careers-page applications go (default: Site content email)
        sync: false

      # --- Security switches (see DEPLOY.md "Security switches") ---
      - key: TURNSTILE_SITE_KEY      # Cloudflare Turnstile bot check on guest checkout / sign-up / bookings
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: ALERT_WEBHOOK_URL       # owner push alerts, e.g. https://ntfy.sh/<secret-topic>
        sync: false
      - key: CLIENT_IP_HEADER        # only if Admin → Settings → Connection check shows the wrong IP
        sync: false
      # Kitchen printer: the Xprinter is plugged into the kitchen tablet (no server settings needed).
      - key: PRINTNODE_API_KEY       # optional backup: a printer on a PC via PrintNode
        sync: false
      - key: PRINTNODE_PRINTER_ID
        sync: false
      - key: WECHAT_APPID
        sync: false
      - key: WECHAT_MCHID
        sync: false
      - key: WECHAT_SERIAL_NO
        sync: false
      - key: WECHAT_PRIVATE_KEY
        sync: false
      - key: WECHAT_API_V3_KEY
        sync: false
      - key: WECHAT_PLATFORM_PUBLIC_KEY
        sync: false
      - key: WECHAT_NOTIFY_URL       # https://www.sambalandsakura.co.uk/api/pay/wechat/notify
        sync: false
