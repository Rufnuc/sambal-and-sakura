<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sambal and Sakura">
  <defs>
    <linearGradient id="goldRing" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0C65A"/>
      <stop offset="0.55" stop-color="#E0A83E"/>
      <stop offset="1" stop-color="#C98A24"/>
    </linearGradient>
    <linearGradient id="petal" x1="64" y1="40" x2="64" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4C9D2"/>
      <stop offset="1" stop-color="#E88A9A"/>
    </linearGradient>
  </defs>
  <!-- charcoal disc -->
  <circle cx="64" cy="64" r="60" fill="#1C1915"/>
  <!-- brushed gold enso ring, open at top-right like a brushstroke -->
  <path d="M96 30 A46 46 0 1 0 103 74" stroke="url(#goldRing)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- sakura petal (five-fold suggested with one hero petal + chili tail = fusion) -->
  <g transform="translate(64 66)">
    <!-- sakura blossom: 5 petals -->
    <g fill="url(#petal)">
      <path d="M0 -26 C7 -20 7 -9 0 -4 C-7 -9 -7 -20 0 -26 Z"/>
      <path d="M0 -26 C7 -20 7 -9 0 -4 C-7 -9 -7 -20 0 -26 Z" transform="rotate(72)"/>
      <path d="M0 -26 C7 -20 7 -9 0 -4 C-7 -9 -7 -20 0 -26 Z" transform="rotate(144)"/>
      <path d="M0 -26 C7 -20 7 -9 0 -4 C-7 -9 -7 -20 0 -26 Z" transform="rotate(216)"/>
      <path d="M0 -26 C7 -20 7 -9 0 -4 C-7 -9 -7 -20 0 -26 Z" transform="rotate(288)"/>
    </g>
    <!-- sambal chili seed center in warm gold -->
    <circle r="6.5" fill="#E0A83E"/>
    <circle r="2.6" fill="#C0362C"/>
  </g>
</svg>
